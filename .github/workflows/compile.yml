name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: List Available Gradle Tasks
        run: gradle tasks --all

      - name: Build with Gradle
        run: gradle assembleDebug --info

      - name: Inspect All Build Outputs
        run: |
          echo "=== All Compiled Artifacts ==="
          find . -type f \( -name "*.apk" -o -name "*.aar" -o -name "*.jar" -o -name "*.so" \)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaQuest-Build-Output
          path: |
            **/*.apk
            **/*.aar
          if-no-files-found: error
